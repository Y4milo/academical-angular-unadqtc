<script src="event-download-certificate.component.ts"></script>
<div class="flex justify-content-center min-h-screen surface-ground pt-6">
    <p-card class="p-shadow-4 w-full md:w-8 lg:w-8 xl:w-7">
      <!-- Imagen centrada -->
      <div class="flex justify-content-center mb-4">
        <h1>EVENTOS UNADQTC</h1>
      </div>
      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-fluid">
        <div class="grid w-full-pb-2">
          <div class="col-12 md:col-6 lg:col-4 flex flex-column gap-2">
            <label for="number">Número de documento</label>
            <input id="number" type="text" pInputText formControlName="number" placeholder="Ingrese número de documento" />
          </div>
          <div class="col-12 md:col-6 lg:col-4 flex flex-column justify-content-end">
            <button
              pButton
              type="submit"
              icon="pi pi-search"
              label="Buscar"
              class="w-full"
            >
            </button>
          </div>
        </div>
      </form>

      <p-dataView #dv [value]="event_data" emptyMessage=" ">
        <ng-template #list let-items>
          <div class="grid grid-cols-12 gap-4 grid-nogutter">
            @for (ed of event_data; track ed; let first = $first) {
              <div class="col-span-12">
                <div
                  class="flex flex-col sm:flex-row sm:items-center pt-6 grid"
                  [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }"
                >
                  <div class="col-12 md:col-4 relative">
                    <img
                      class="block xl:block mx-auto rounded-border w-full"
                      [src]="apiUrlPublic + '/' + ed.event.url_banner"
                      [alt]="ed.event.slug"
                    />
                    <p-tag
                      [value]="ed.event.event_mode?.label"
                      styleClass="text-white {{ getModeColor(ed.event.event_mode?.value) }}"
                      class="absolute m-2"
                      [style.left.px]="4"
                      [style.top.px]="4"
                    />
                  </div>
                  <div class="col-12 md:col-8 grid">
                    <div class="col-12 md:col-10 justify-between items-start gap-2 flex align-items-center">
                      <div>
                        <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">{{ ed.event.title }}</div>
                        <span [class]="['text-upper', 'text-secondary', 'font-light', 'text-sm']">
                          {{ full_name }}
                        </span>
                        <br>
                        <span [class]="['font-italic', 'text-secondary', 'font-light', 'text-sm', getParticipantColor(ed.participant_type.value)]">
                          {{ ed.participant_type.label }}
                        </span>
                      </div>
                    </div>
                    <div class="col-12 md:col-2 flex align-items-center">
                      <p-button
                        icon="pi pi-download"
                        class="flex-auto md:flex-initial whitespace-nowrap"
                        pTooltip="Descargar Certificado"
                        [rounded]="true"
                        variant="outlined"
                      />
                    </div>
                  </div>
                </div>
              </div>
            }
          </div>
        </ng-template>
        <ng-template #empty>
          <div class="flex flex-col items-center justify-center p-8 text-surface-500 dark:text-surface-400">
            <i class="pi pi-search text-4xl mb-4"></i>
            <span class="text-lg font-medium">No se encontraron certificados</span>
            <p class="text-sm">Verifica el número de documento e intenta de nuevo.</p>
          </div>
        </ng-template>
      </p-dataView>
    </p-card>
</div>
