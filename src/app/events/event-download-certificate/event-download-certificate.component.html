<div class="flex flex-column align-items-center min-h-screen surface-ground pt-6 event-download-bg gap-4">
  <div class="flex justify-content-center mb-4">
    <div class="flex align-items-center gap-3">
      <img class="logo-unadqtc" src="/img/events/logo_unadqtc.svg" alt="Logo UNADQTC" />
    </div>
  </div>
  <div class="flex justify-content-center">
    <img class="logo-events" src="/img/events/logo_events.svg" alt="Logo eventos" />
  </div>

  <div class="p-shadow-4 px-3 w-full md:w-8 lg:w-6 xl:w-5">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-fluid mb-4">
      <div class="grid w-full-pb-2">
        <div class="col-12 md:col-6 flex flex-column gap-2">
          <label for="number" class="text-white">Número de documento</label>
          <input id="number" type="text" pInputText formControlName="number" placeholder="Ingrese número de documento" />
        </div>
        <div class="col-12 md:col-6 flex flex-column justify-content-end">
          <button
            pButton
            type="submit"
            icon="pi pi-search"
            label="Buscar"
            class="w-full btn-search"
          >
          </button>
        </div>
      </div>
    </form>
  </div>
  <div class="p-shadow-4 px-3 w-full md:w-8 lg:w-8 xl:w-7">
    <p-card >
      <!-- Formulario -->
      <p-dataView #dv [value]="event_data" emptyMessage=" ">
        <ng-template #list let-items>
          <div class="grid grid-cols-12 gap-4 grid-nogutter">
            @for (ed of event_data; track ed; let first = $first) {
              <div class="col-span-12">
                <div
                  class="flex flex-col sm:flex-row sm:items-center pt-3 grid"
                  [ngClass]="{ 'border-t border-surface-200': !first }"
                >
                  <div class="col-12 md:col-4 relative">
                    <img
                      class="block xl:block mx-auto rounded-border w-full"
                      [src]="apiBase + '/' + ed.event.url_logo"
                      [alt]="ed.event.slug"
                    />
                    <p-tag
                      [value]="ed.event.event_mode?.label"
                      styleClass="text-white {{ getModeColor(ed.event.event_mode?.value) }}"
                      class="absolute m-2"
                      [style.left.px]="4"
                      [style.top.px]="4"
                    />
                  </div>
                  <div class="col-12 md:col-8 grid">
                    <div class="col-12 md:col-10 justify-between items-start gap-2 flex align-items-center">
                      <div>
                        <div class="text-lg font-medium text-surface-900 mt-2">{{ ed.event.title }}</div>
                        <span [class]="['text-upper', 'text-secondary', 'font-light', 'text-sm']">
                          {{ full_name }}
                        </span>
                        <br>
                        <span [class]="['font-italic', 'text-secondary', 'font-bold', 'text-sm', getParticipantColor(ed.participant_type.value)]">
                          {{ ed.participant_type.label }}
                        </span>
                      </div>
                    </div>
                    <div class="col-12 md:col-2 flex align-items-center">
                      <!--<p-button
                        icon="pi pi-download"
                        class="flex-auto md:flex-initial whitespace-nowrap"
                        pTooltip="Descargar Certificado"
                        [rounded]="true"
                        variant="outlined"
                      />-->
                    </div>
                  </div>
                </div>
              </div>
            }
          </div>
        </ng-template>
        <ng-template #empty>
          <div class="flex flex-col items-center justify-center p-8 text-surface-500">
            <i class="pi pi-search text-4xl mb-4"></i>
            <span class="text-lg font-medium">No se encontraron certificados</span>
            <p class="text-sm">Verifica el número de documento e intenta de nuevo.</p>
          </div>
        </ng-template>
      </p-dataView>
    </p-card>
  </div>
  <div class="flex justify-content-between p-4 w-full md:w-8 lg:w-8 xl:w-7 text-sm text-secondary footer-sticky">
    <span class="flex align-items-center gap-2 text-white font-italic font-semibold">
      <i class="pi pi-hashtag" style="font-size: 1.5rem"></i>
      <span>Yo Sumo al Licenciamiento</span>
    </span>
    <a class="flex align-items-center gap-2 text-white font-semibold" href="https://www.unadqtc.edu.pe" target="_blank" rel="noopener noreferrer">
      <app-lucide-icon name="chevrons-right" [size]="24"></app-lucide-icon>
      <span>www.unadqtc.edu.pe</span>
    </a>
  </div>
</div>
