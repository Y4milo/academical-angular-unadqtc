<div class="flex justify-content-center align-items-center min-h-screen surface-ground">
  <p-card class="p-shadow-4 w-full md:w-8 lg:w-6 xl:w-5">
    <!-- Imagen centrada -->
    <div class="flex justify-content-center mb-4">
      <img [src]="portrait_url" alt="Foto de carnet" class="portrait">
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-fluid">

      <app-form-field class="block mb-4" label="Tipo de documento" for="idtype_id" [required]="true"
                      [control]="form.controls['idtype_id']" invalidMessage="Seleccione el tipo de documento.">
        <p-dropdown
          id="idtype_id"
          formControlName="idtype_id"
          [options]="idTypes"
          optionLabel="name"
          optionValue="code"
          placeholder="Seleccione un tipo">
        </p-dropdown>
      </app-form-field>

      <app-form-field class="block mb-4" label="Número de documento" for="number" [required]="true"
                      [control]="form.controls['number']" invalidMessage="Ingrese un número de documento de hasta 10 caracteres.">
        <input id="number" type="text" pInputText formControlName="number" placeholder="Ingrese número" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Nombres" for="names" [required]="true"
                      [control]="form.controls['names']" invalidMessage="Ingrese sus nombres.">
        <input id="names" type="text" pInputText formControlName="names" placeholder="Ingrese nombres" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Apellido paterno" for="last_name" [required]="true"
                      [control]="form.controls['last_name']" invalidMessage="Ingrese su apellido paterno.">
        <input id="last_name" type="text" pInputText formControlName="last_name" placeholder="Ingrese apellido paterno" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Apellido materno" for="maternal_last_name" [required]="true"
                      [control]="form.controls['maternal_last_name']" invalidMessage="Ingrese su apellido materno.">
        <input id="maternal_last_name" type="text" pInputText formControlName="maternal_last_name" placeholder="Ingrese apellido materno" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Género" for="gender_id" [required]="true"
                      [control]="form.controls['gender_id']" invalidMessage="Seleccione su género.">
        <p-dropdown
          id="gender_id"
          formControlName="gender_id"
          [options]="genders"
          optionLabel="name"
          optionValue="code"
          placeholder="Seleccione género">
        </p-dropdown>
      </app-form-field>

      <app-form-field class="block mb-4" label="Celular" for="phone" [required]="true"
                      [control]="form.controls['phone']" invalidMessage="Ingrese un celular de hasta 15 caracteres.">
        <input id="phone" type="text" pInputText formControlName="phone" placeholder="Ingrese número de celular" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Correo electrónico" for="email" [required]="true"
                      [control]="form.controls['email']" invalidMessage="Ingrese un correo electrónico válido.">
        <input id="email" type="email" pInputText formControlName="email" placeholder="Ingrese su correo" />
      </app-form-field>

      <app-form-field class="block mb-4" label="Tipo de participante" for="participant_type_id" [required]="true"
                      [control]="form.controls['participant_type_id']" invalidMessage="Seleccione el tipo de participante.">
        <p-dropdown
          id="participant_type_id"
          formControlName="participant_type_id"
          [options]="participantTypes"
          optionLabel="name"
          optionValue="code"
          placeholder="Seleccione tipo">
        </p-dropdown>
      </app-form-field>

      <!-- Botón de Envío -->
      <div class="flex justify-content-center mt-4">
        <button pButton type="submit" label="Registrar" icon="pi pi-save" [loading]="loading"></button>
      </div>
    </form>
  </p-card>
</div>

<p-dialog header="¡Únete al grupo de WhatsApp!" [(visible)]="showWhatsappModal" [modal]="true" [closable]="true" [dismissableMask]="true" [style]="{width: '400px'}">
  <p>Gracias por registrarte. Para recibir actualizaciones, únete a nuestro grupo de WhatsApp:</p>
  <div class="flex justify-content-center mt-4">
    <a [href]="whatsappLink" target="_blank">
      <button pButton type="button" label="Unirse al grupo" icon="pi pi-whatsapp"></button>
    </a>
  </div>
  <p-footer>
    <button pButton type="button" label="Cerrar" icon="pi pi-times" (click)="closeModal()" class="p-button-text"></button>
  </p-footer>
</p-dialog>
