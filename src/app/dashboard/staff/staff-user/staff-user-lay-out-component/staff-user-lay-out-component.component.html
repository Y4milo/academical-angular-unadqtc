<div class="flex justify-content-center min-h-screen">
  <div class="p-shadow-4 w-full md:w-9 lg:w-10 xl:w-10 mt-5">
    <p-menubar [model]="items">
      <ng-template pTemplate="item" let-item>
        <a class="p-menuitem-link" [routerLink]="item.routerLink" (click)="onMenuItemClick($event, item)">
          @if ($any(item).lucide) {
            <lucide-icon
              [img]="$any(item).lucide"
              class="mr-2 w-4 h-4"
            />
          }
          <span>{{ item.label }}</span>
        </a>
      </ng-template>
    </p-menubar>
    <!-- 🔵 AQUÍ SE CARGAN TODAS LAS RUTAS HIJAS -->
    <div class="mt-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<p-dialog
  header="Cambiar contraseña"
  [(visible)]="showChangePasswordDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(440px, 92vw)' }"
  (onHide)="closeChangePasswordDialog()">
  <form class="p-fluid change-password-form" #passwordForm="ngForm" (ngSubmit)="changePassword()">
    <div class="field">
      <label for="current_password">Contraseña actual</label>
      <p-password
        id="current_password"
        name="current_password"
        [(ngModel)]="currentPassword"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div class="field">
      <label for="new_password">Nueva contraseña</label>
      <p-password
        id="new_password"
        name="new_password"
        [(ngModel)]="newPassword"
        [toggleMask]="true"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div class="field">
      <label for="confirm_password">Confirmar contraseña</label>
      <p-password
        id="confirm_password"
        name="confirm_password"
        [(ngModel)]="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" class="p-error text-sm mb-3">
      La confirmación de la contraseña no coincide.
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        class="p-button-text"
        [disabled]="savingPassword"
        (click)="closeChangePasswordDialog()">
      </button>

      <button
        pButton
        type="submit"
        label="Guardar"
        icon="pi pi-save"
        [loading]="savingPassword"
        [disabled]="savingPassword">
      </button>
    </div>
  </form>
</p-dialog>
