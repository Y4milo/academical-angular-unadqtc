<p-dialog
  header="Cambiar contraseña"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(440px, 92vw)' }"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="close()">
  <form class="p-fluid change-password-form" #passwordForm="ngForm" (ngSubmit)="changePassword()">
    <div class="field">
      <label for="current_password">Contraseña actual</label>
      <p-password
        id="current_password"
        name="current_password"
        [(ngModel)]="currentPassword"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div class="field">
      <label for="new_password">Nueva contraseña</label>
      <p-password
        id="new_password"
        name="new_password"
        [(ngModel)]="newPassword"
        [toggleMask]="true"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div class="field">
      <label for="confirm_password">Confirmar contraseña</label>
      <p-password
        id="confirm_password"
        name="confirm_password"
        [(ngModel)]="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        [style]="{ display: 'block' }"
        required>
      </p-password>
    </div>

    <div *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" class="p-error text-sm mb-3">
      La confirmación de la contraseña no coincide.
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        class="p-button-text"
        [disabled]="savingPassword"
        (click)="close()">
      </button>

      <button
        pButton
        type="submit"
        label="Guardar"
        icon="pi pi-save"
        [loading]="savingPassword"
        [disabled]="savingPassword">
      </button>
    </div>
  </form>
</p-dialog>
