<p-dialog
  header="Cambiar contraseña"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(440px, 92vw)' }"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="close()">
  <form class="p-fluid change-password-form" #passwordForm="ngForm" (ngSubmit)="changePassword()">
    <app-form-field label="Contraseña actual" for="current_password" [required]="true" [error]="errors.current">
      <p-password
        id="current_password"
        name="current_password"
        [(ngModel)]="currentPassword"
        [toggleMask]="true"
        [feedback]="false"
        [inputStyleClass]="errors.current ? 'w-full ng-invalid ng-dirty' : 'w-full'"
        [style]="{ display: 'block' }">
      </p-password>
    </app-form-field>

    <app-form-field label="Nueva contraseña" for="new_password" [required]="true" [error]="errors.new">
      <p-password
        id="new_password"
        name="new_password"
        [(ngModel)]="newPassword"
        [toggleMask]="true"
        [inputStyleClass]="errors.new ? 'w-full ng-invalid ng-dirty' : 'w-full'"
        [style]="{ display: 'block' }">
      </p-password>
    </app-form-field>

    <app-form-field label="Confirmar contraseña" for="confirm_password" [required]="true" [error]="errors.confirm">
      <p-password
        id="confirm_password"
        name="confirm_password"
        [(ngModel)]="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        [inputStyleClass]="errors.confirm ? 'w-full ng-invalid ng-dirty' : 'w-full'"
        [style]="{ display: 'block' }">
      </p-password>
    </app-form-field>

    <div class="flex justify-content-end gap-2 mt-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        class="p-button-text"
        [disabled]="savingPassword"
        (click)="close()">
      </button>

      <button
        pButton
        type="submit"
        label="Guardar"
        icon="pi pi-save"
        [loading]="savingPassword"
        [disabled]="savingPassword">
      </button>
    </div>
  </form>
</p-dialog>
