<section class="general-data">
  <app-page-header title="Datos generales" subtitle="Configuración institucional vigente de Grados y Títulos."></app-page-header>

  <div *ngIf="loading" class="institutional-surface skeleton-stack" aria-busy="true" aria-label="Cargando datos generales">
    <p-skeleton width="40%" height="1.5rem"></p-skeleton>
    <p-skeleton *ngFor="let row of [1, 2, 3, 4]" width="100%" height="3.5rem"></p-skeleton>
  </div>

  <app-authority-directory *ngIf="!loading && !activeRoleKey" [roles]="roles" (manage)="manage($event)"></app-authority-directory>

  <app-authority-management *ngIf="activeRoleKey" [roleKey]="activeRoleKey" [prefixes]="professionalPrefixes"
    (back)="backToDirectory()" (changed)="load()"></app-authority-management>
</section>
